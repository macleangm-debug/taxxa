events {
    worker_connections 4096;
}

http {
    # Connection pooling
    upstream taxxa_api {
        least_conn;  # Load balancing: least connections
        keepalive 100;  # Connection pooling
        
        server api-1:8001 weight=1 max_fails=3 fail_timeout=30s;
        server api-2:8001 weight=1 max_fails=3 fail_timeout=30s;
        server api-3:8001 weight=1 max_fails=3 fail_timeout=30s;
        server api-4:8001 weight=1 max_fails=3 fail_timeout=30s;
        server api-5:8001 weight=1 max_fails=3 fail_timeout=30s;
        server api-6:8001 weight=1 max_fails=3 fail_timeout=30s;
        server api-7:8001 weight=1 max_fails=3 fail_timeout=30s;
        server api-8:8001 weight=1 max_fails=3 fail_timeout=30s;
    }

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=1000r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Logging
    log_format json_combined escape=json '{'
        '"time": "$time_iso8601",'
        '"remote_addr": "$remote_addr",'
        '"request_method": "$request_method",'
        '"request_uri": "$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent": "$body_bytes_sent",'
        '"request_time": "$request_time",'
        '"upstream_response_time": "$upstream_response_time",'
        '"upstream_addr": "$upstream_addr"'
    '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # Client settings
        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffers
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Health check endpoint (no rate limiting)
        location /api/health {
            proxy_pass http://taxxa_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # High-throughput scan endpoints
        location /api/v3/scan {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 100;
            
            proxy_pass http://taxxa_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            
            # Response caching disabled for scans (real-time)
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        location /api/v4/scan {
            limit_req zone=api_limit burst=100 nodelay;
            limit_conn conn_limit 100;
            
            proxy_pass http://taxxa_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        # All other API endpoints
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://taxxa_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Nginx status (for monitoring)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
