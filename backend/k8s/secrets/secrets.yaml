apiVersion: v1
kind: Secret
metadata:
  name: taxxa-secrets
  namespace: taxxa
type: Opaque
stringData:
  # MongoDB Connection (Update with your sharded cluster URI)
  MONGO_URL: "mongodb://taxxa-user:CHANGE_ME@mongodb-router-0.mongodb-router:27017,mongodb-router-1.mongodb-router:27017,mongodb-router-2.mongodb-router:27017/taxxa_db?authSource=admin&replicaSet=rs0"
  DB_NAME: "taxxa_db"
  
  # JWT Secret (Generate with: openssl rand -hex 32)
  JWT_SECRET: "CHANGE_ME_GENERATE_SECURE_SECRET"
  
  # Admin Credentials
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "CHANGE_ME_SECURE_PASSWORD"
  SUPER_ADMIN_EMAIL: "admin@taxxa.io"
  SUPER_ADMIN_PASSWORD: "CHANGE_ME_SUPER_SECURE"
  
  # Redis Password
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: taxxa
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "CHANGE_ME_MONGO_ROOT"
  TAXXA_USER: "taxxa-user"
  TAXXA_PASSWORD: "CHANGE_ME_TAXXA_USER"
